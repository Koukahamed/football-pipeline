name: ⚽ Football Daily Digest
on:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'ingestion/**'
      - 'report/**'
      - 'requirements.txt'
      - '.github/workflows/football_daily.yml'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      preview_only:
        description: Générer les aperçus sans envoyer de mail ni publier
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: football-daily
  cancel-in-progress: false
jobs:
  daily_digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      generated: ${{ steps.build.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: football-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: football-data-
      - name: Read durable data
        uses: actions/checkout@v4
        with:
          ref: football-data
          path: .durable
          sparse-checkout: data
      - name: Restore durable history and last good responses
        run: |
          mkdir -p data
          if [ -d .durable/data ]; then
            cp -a .durable/data/. data/
          fi
      - name: Extract
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python ingestion/fetch_data.py
      - name: Generate dashboard and mail preview
        id: build
        run: |
          python report/generate_dashboard.py
          python report/send_email.py --preview-only
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: football-preview
          path: report/output
          retention-days: 14
      - uses: actions/cache/save@v4
        if: github.event_name != 'workflow_dispatch' || !inputs.preview_only
        with:
          path: data
          key: football-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare durable data
        if: github.event_name != 'workflow_dispatch' || !inputs.preview_only
        run: |
          mkdir -p durable/data
          cp -a data/. durable/data/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || !inputs.preview_only
        with:
          name: football-durable-data
          path: durable
          retention-days: 7
      - name: Send email
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.preview_only)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python report/send_email.py
  persist:
    needs: daily_digest
    if: always() && needs.daily_digest.outputs.generated == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.preview_only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football-durable-data
          path: durable
      - name: Version history and last good responses
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: durable
          publish_branch: football-data
  publish:
    needs: daily_digest
    if: always() && needs.daily_digest.outputs.generated == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.preview_only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football-preview
          path: public
      - name: Remove private email preview
        run: rm -f public/email_preview.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages

