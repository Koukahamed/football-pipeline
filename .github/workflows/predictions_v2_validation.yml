name: Predictions V2 validation
on:
  push:
    branches: [feat/predictions-v2]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: football-daily
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ingestion report
      - name: Validate dashboard JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('report/dashboard.html').read_text(); Path('/tmp/dashboard.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/dashboard.js
      - uses: actions/checkout@v4
        with:
          ref: football-data
          path: .durable
          sparse-checkout: data
      - run: |
          mkdir -p data
          cp -a .durable/data/. data/
      - name: Reuse verified historical backfill when available
        if: hashFiles('data/training/coverage.json') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: predictions-v2-validation
          run-id: 41673775450
          github-token: ${{ github.token }}
          path: .v2-bootstrap
      - name: Restore historical training inputs only
        run: |
          if [ -d .v2-bootstrap/data/training ]; then
            mkdir -p data/training
            cp -a .v2-bootstrap/data/training/. data/training/
          fi
          if [ -f .v2-bootstrap/data/predictions/model_report.json ]; then
            mkdir -p data/predictions
            cp .v2-bootstrap/data/predictions/model_report.json data/predictions/
          fi
      - name: Backfill history and refresh current results
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python ingestion/fetch_data.py
          python ingestion/history.py
          python ingestion/team_news.py
      - name: Chronological model comparison and calibration
        run: python report/model_v2.py
      - name: Generate previews without sending mail
        run: |
          python report/generate_dashboard.py
          python report/send_email.py --preview-only
      - name: Browser integration tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/dashboard.cjs
          node tests/dynamics.cjs
          node tests/predictions_v2.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictions-v2-validation
          path: |
            report/output
            data/training
            data/context
            data/predictions
          retention-days: 14
