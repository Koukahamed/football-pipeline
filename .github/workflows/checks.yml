name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ingestion report
      - name: Check dashboard JavaScript
        run: |
          python -c "from pathlib import Path; t=Path('report/dashboard.html').read_text(); Path('/tmp/dashboard.js').write_text(t.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/dashboard.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser integration test
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/dashboard.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-mobile
          path: /tmp/football-mobile.png
